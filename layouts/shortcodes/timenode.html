{{- $title := .Get 0 | default "" -}}
{{- $time := .Get 1 | default "" -}}
{{- $icon := .Get 2 | default "" -}}
<div class="timeline-item">
  <div class="timeline-item-left">
    {{- if $icon -}}<i class="{{ $icon | htmlEscape }}"></i>{{- else -}}<div class="timeline-item-dot"></div>{{- end -}}
  </div>
  <div class="timeline-item-right">
    {{- if $time -}}<div class="timeline-item-time">{{ $time }}</div>{{- end -}}
    <div class="timeline-item-title">{{ $title }}</div>
    <div class="timeline-item-content">
      {{- .Inner | markdownify -}}
    </div>
  </div>
</div>
